<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="box">

    <h2>Forgot Password</h2>

    <p>Enter your registered email address.</p>

    <form method="POST">

        <input type="email"
               name="email"
               placeholder="Enter your registered email"
               required>

        <br><br>

        <button type="submit">
            Continue
        </button>

    </form>

    <br>

    <a href="/login">
        Back to Login
    </a>

</div>

</body>
</html>
