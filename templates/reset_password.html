<!DOCTYPE html>
<html>
<head>
    <title>Reset Password</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="box">

    <h2>Reset Password</h2>

    <p>Enter your new password.</p>

    <form method="POST">

        <input type="password"
               name="password"
               placeholder="Enter new password"
               required>

        <br><br>

        <input type="password"
               name="confirm_password"
               placeholder="Confirm new password"
               required>

        <br><br>

        <button type="submit">
            Reset Password
        </button>

    </form>

    <br>

    <a href="/login">
        Back to Login
    </a>

</div>

</body>
</html>
